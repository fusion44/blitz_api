[tool.poetry]
name = "blitz_api"
version = "0.5.1"
description = "A backend for the Raspiblitz project"
authors = ["fusion44 <some.fusion@gmail.com>"]
license = "MIT"
packages = [
    { include = "app" },
]

[tool.poetry.dependencies]
python = "^3.12 | ^3.11"
fastapi = {extras = ["standard"], version = "0.115.12"}
fastapi-plugins = "0.13.2"
starlette = "0.45.3"
anyio = "4.9.0"
uvicorn = {extras = ["standard"], version = "0.34.2"}
pydantic = "2.10.6"
pydantic-core = "2.27.2"
typing-extensions = "4.12.2"
pyjwt = "2.10.1"
python-decouple = "3.8"
psutil = "7.0.0"
requests = "2.32.3"
pyzmq = "26.4.0"
aiohttp = "3.11.18"
grpcio = "1.71.0"
grpcio-tools = "1.71.0"
protobuf = "5.29.3"
deepdiff = "8.4.2"
loguru = "0.7.3"
celery = {extras = ["redis"], version = "5.5.2"}


[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
pytest-asyncio = "0.25.3"
coverage = "7.8.0"
ruff = "0.9.6"
debugpy = "1.8.14"
click = "8.1.8"
watchfiles = "0.24.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow auto fix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "app/lightning/impl/protos/*"
]

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

target-version = "py311"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.poetry.scripts]
api = "app.server:main"
